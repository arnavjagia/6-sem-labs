<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        
        h1 {
            color: #333;
        }
        
        form {
            margin-top: 20px;
        }
        
        input[type="number"] {
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        select {
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        .result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>Calculator</h1>
    
    <form method="post">
        {% csrf_token %}
        <div>
            <label for="num1">First Number:</label>
            <input type="number" id="num1" name="num1" value="{{ num1 }}" required>
        </div>
        
        <div>
            <label for="operation">Operation:</label>
            <select id="operation" name="operation">
                <option value="add" {% if operation == 'add' %}selected{% endif %}>Addition (+)</option>
                <option value="subtract" {% if operation == 'subtract' %}selected{% endif %}>Subtraction (-)</option>
                <option value="multiply" {% if operation == 'multiply' %}selected{% endif %}>Multiplication (×)</option>
                <option value="divide" {% if operation == 'divide' %}selected{% endif %}>Division (÷)</option>
            </select>
        </div>
        
        <div>
            <label for="num2">Second Number:</label>
            <input type="number" id="num2" name="num2" value="{{ num2 }}" required>
        </div>
        
        <div>
            <button type="submit">Calculate</button>
        </div>
    </form>
    
    {% if result is not None %}
    <div class="result">
        <h3>Result:</h3>
        {% if operation_symbol %}
            <p>{{ num1 }} {{ operation_symbol }} {{ num2 }} = {{ result }}</p>
        {% else %}
            <p>{{ result }}</p>
        {% endif %}
    </div>
    {% endif %}
</body>
</html>
